[package]
name = "warren-speller-pg-laws"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Kenneth Allen Flegal"]
description = "The laws of warren-speller-pg, in a test-only PostgreSQL extension that installs its planner hook"
repository = "https://github.com/soulstompp/warren-speller"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14", "warren-speller-pg/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15", "warren-speller-pg/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16", "warren-speller-pg/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17", "warren-speller-pg/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18", "warren-speller-pg/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
warren-speller-pg = { path = "../warren-speller-pg", default-features = false }

[dev-dependencies]
[dev-dependencies.postgres]
version = "0.19"

[dev-dependencies.pgrx-tests]
version = "=0.19.2"
