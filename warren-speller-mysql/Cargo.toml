# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "warren-speller-mysql"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Kenneth Allen Flegal"]
description = "MySQL statements respelled to read less and return the same rows: a join taken out of a UNION ALL, a grouping taken to each side of a join, each side kept to the keys the other holds"
repository = "https://github.com/soulstompp/warren-speller"
readme = "README.md"
keywords = ["mysql", "sql", "rewrite", "query"]
categories = ["database"]

[dependencies]
sqlparser = { version = "0.63.0", features = ["visitor"] }
